<form
    id="publishForm"
    hx-post="{% url 'promotion:publish_promotion' promotion.id %}"
    hx-target="#publishModalBody"
    hx-swap="innerHTML"
>
    {% csrf_token %}

    <label class="form-label fw-bold">เลือกการเผยแพร่</label>

    {% if perms.PromotionHub.publish_promotion_hub_airforce %}
    <div class="form-check">
        <input 
            class="form-check-input" 
            type="radio" 
            name="publish_type" 
            value="A"
            hx-get="{% url 'promotion:publish_dynamic_options' promotion.id %}"
            hx-target="#publishDynamic"
            hx-swap="innerHTML"
        >
        <label class="form-check-label">ทอ.</label>
    </div>
    {% endif %}

    <div class="form-check">
        <input 
            class="form-check-input" 
            type="radio" 
            name="publish_type" 
            value="U"
            hx-get="{% url 'promotion:publish_dynamic_options' promotion.id %}"
            hx-target="#publishDynamic"
            hx-swap="innerHTML"
        >
        <label class="form-check-label">หน่วย</label>
    </div>

    <div class="form-check">
        <input 
            class="form-check-input" 
            type="radio" 
            name="publish_type" 
            value="G"
            hx-get="{% url 'promotion:publish_dynamic_options' promotion.id %}"
            hx-target="#publishDynamic"
            hx-swap="innerHTML"
        >
        <label class="form-check-label">กลุ่ม</label>
    </div>

    <div id="publishDynamic" class="mt-3">
        <!-- HTMX จะโหลด field ของแต่ละ type มาใส่ -->
    </div>

    <button type="button" id="btnPublish" class="btn btn-primary mt-3">
        ยืนยันเผยแพร่
    </button>
</form>
