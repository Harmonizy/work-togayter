<div class="modal-header">
    <h5 class="modal-title">เผยแพร่ประชาสัมพันธ์</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

    <form
        hx-post="{% url 'promotion:publish_promotion' promotion.id %}"
        hx-target="#publishModalContent"
        hx-swap="innerHTML">
        {% csrf_token %}
        <label class="fw-bold">เลือกรูปแบบการเผยแพร่:</label>

        <div class="form-check mt-2">
            <input class="form-check-input"
                   type="radio"
                   name="publish_mode"
                   value="A"
                   checked
                   hx-get="{% url 'promotion:publish_unit_form' promotion.id %}"
                   hx-target="#unitList"
                   hx-swap="innerHTML">
            <label class="form-check-label">AIRFORCE (ทุกหน่วย)</label>
        </div>

        <div class="form-check">
            <input class="form-check-input"
                   type="radio"
                   name="publish_mode"
                   value="U"
                   hx-get="{% url 'promotion:publish_unit_form' promotion.id %}"
                   hx-target="#unitList"
                   hx-swap="innerHTML">
            <label class="form-check-label">เลือกหน่วย</label>
        </div>

        <div id="unitList" class="mt-3">
            <!-- HTMX โหลด checkbox หน่วย -->
        </div>

        <div class="mt-4 text-end">
            <button type="submit" class="btn btn-primary">ยืนยันเผยแพร่</button>
        </div>

    </form>

</div>
