{% extends "partials/base.html" %}
{% block content %}
<div class="container mt-4">

  <h3 class="mb-3">➕ สร้างแบบทดสอบ</h3>

  <form method="POST">
    {% csrf_token %}

    <div class="card mb-4">
      <div class="card-body">
        <h5>ข้อมูลแบบทดสอบ</h5>
        {{ quiz_form.as_p }}
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5>คำถาม</h5>

        {{ question_formset.management_form }}

        {% for form in question_formset %}
        <div class="border p-3 mb-3">
          <h6>คำถามที่ {{ forloop.counter }}</h6>
          {{ form.as_p }}
        </div>
        {% endfor %}
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">บันทึก</button>
      <a href="{% url 'promotion:quiz_list' %}" class="btn btn-secondary">ยกเลิก</a>
    </div>

  </form>

</div>
{% endblock %}
