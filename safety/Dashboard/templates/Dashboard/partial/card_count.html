<div class="col-xl-4 col-md-6">
    <!-- card -->
    <div class="card card-animate">
        <div class="card-body">
            <div class="d-flex align-items-center">
                <div class="flex-grow-1 overflow-hidden">
                    <p class="text-uppercase fw-medium text-muted text-truncate mb-0">{{ name }}</p>
                </div>
                <div class="flex-shrink-0">
                    {% comment %} <h5 class="text-success fs-14 mb-0">
                        <i class="ri-arrow-right-up-line fs-13 align-middle"></i> -0.0 %
                    </h5> {% endcomment %}
                </div>
            </div>
            <div class="d-flex align-items-end justify-content-between mt-4">
                <div>
                    <h4 class="fs-22 fw-semibold ff-secondary mb-4"><span
                            class="counter-value" data-target="{{ value }}">0</span> เรื่อง</h4>
                    <a href="{% url 'report:safety-report.list' %}?status={{ status }}&priority={{ priority }}" class="text-decoration-underline">
                        รายละเอียด
                    </a>
                </div>
                <div class="avatar-sm flex-shrink-0">
                    <span class="avatar-title bg-success-subtle rounded fs-3">
                        <i class="bx bxs-{{ logo }} text-{{ color }}"></i>
                    </span>
                </div>
            </div>
        </div><!-- end card body -->
    </div><!-- end card -->
</div><!-- end col -->
