      <div class="card banner-warning mb-3">
        <div class="card-body d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle bg-white d-flex align-items-center justify-content-center"
                 style="width:56px;height:56px;border:1px solid #ffe59a;">
              <i class="bi bi-file-earmark-text" style="font-size:1.25rem;color:#ffb300;"></i>
            </div>
            <div>
              <h2 class="mb-1" style="line-height:1.25;">{{ base_report.title }}</h2>
              
              {% if base_report.priority %}
                <span class="badge bg-primary fs-6">ความสำคัญ: {{ base_report.get_priority_display }}</span>
              {% endif %}

              <span class="badge bg-secondary fs-6">ปี: {{ base_report.fiscal_year }}</span>
              <span class="badge bg-info text-dark fs-6">สถานะ: {{ base_report.get_status_display }}</span>
            </div>
          </div>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            {% if not base_report.hazard_log.all.exists %}
              <button class="btn btn-outline-primary"
                      onclick="window.location.href='{% url 'risk_management:hazard-log.create-by-report' base_report.id %}'">
                สร้าง Harzard - log
              </button>
            {% else %}
              <button class="btn btn-outline-secondary"
                      onclick="window.location.href='{% url 'risk_management:hazard-detail' base_report.hazard_log.all.first.id %}'">
                ดู Harzard - log ของ Report
              </button>
            {% endif %}

          </div>


        </div>
      </div>
