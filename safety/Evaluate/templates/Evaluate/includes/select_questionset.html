<form id="questionset-form" class="d-flex gap-2 align-items-end flex-wrap">
    <div>
    <select class="form-select" id="questionset-select">
        <option value="" disabled selected>เลือกชุดคำถาม</option>
        {% for qs in question_sets %}
        {% if qs.start_question %}
            <option value="{{ qs.start_question.id }}">{{ forloop.counter }}. {{ qs.name }}</option>
        {% endif %}
        {% endfor %}
    </select>
    </div>
  
  <button type="button" class="btn btn-primary"
          onclick="redirectToEvaluate({{ report_id }})">
    ประเมิน
  </button>
</form>

<script>
  function redirectToEvaluate(reportId) {
    const select = document.getElementById("questionset-select");
    const questionId = select.value;
    if (questionId) {
      window.location.href = `/safety-evaluate/evaluate-main/${reportId}/${questionId}/`;
    } else {
      alert("กรุณาเลือกชุดคำถามก่อนดำเนินการประเมิน");
    }
  }
</script>
