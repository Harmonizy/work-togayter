<!-- Include Bootstrap CSS in your <head> -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="//unpkg.com/alpinejs" defer></script>

<style>
    #qa-thread {
        font-size: 1rem;
    }
    #qa-thread .btn {
        min-width: 80px;
    }
</style>
<!-- Evaluation SPA -->
<div class="container py-4" x-data="evaluationFlow()" x-init="init()">
    <h3 class="mb-4">Evaluation</h3>

    <div id="qa-thread" class="border rounded p-3 bg-light" style="max-height: 70vh; overflow-y: auto;">
        <template x-for="(entry, index) in history" :key="index">
            <div class="mb-3">
                <div class="fw-bold text-primary" x-text="`${index+1}. ${entry.question}`"></div>
                <div class="text-muted">
                    <template x-if="entry.answer === 'Y'">
                        <span class="text-success">✔️ ใช่</span>
                    </template>
                    <template x-if="entry.answer === 'N'">
                        <span class="text-danger">❌ ไม่ใช่</span>
                    </template>
                </div>
            </div>
        </template>
        <div x-show="loading" class="text-center my-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Current Question -->
        <template x-if="current && current.type === 'question'">
            <div class="mb-3">
                <div class="fw-bold text-primary" x-text="current.text"></div>
                <div class="mt-2">
                    <button @click="sendAnswer('Y')" class="btn btn-success me-2">Yes</button>
                    <button @click="sendAnswer('N')" class="btn btn-danger">No</button>
                </div>
            </div>
        </template>

        <!-- Final Result -->
        <template x-if="current && current.type === 'result'">
            <div class="alert alert-warning mt-4">
                <h5 class="alert-heading" >
                    <span x-text="current.result_type"></span> :
                    <span x-text="current.name"></span>
                    (<span class="text-muted fst-bold" x-text="current.english_name"></span>)
                </h5>
                <p class="mt-2" x-text="current.description"></p>

                <div class="mt-3 text-end">
                    <button class="btn btn-primary" @click="submitAnswers()" x-show="!submitted">
                        บันทึกผลการประเมิน
                    </button>
                    <div class="text-success mt-2 fw-bold" x-show="submitted">✅ Submitted!</div>
                </div>
            </div>
        </template>

    </div>
</div>


<script>
function evaluationFlow() {
    return {
        history: [],      // Stores previous Q&A
        current: null,    // Current question or result
        currentId: null,
        submitted: false,
        loading: false,
        
        init() {
            // Load first question (hardcoded or dynamic)
            this.currentId = 1; // Replace with dynamic value if needed
            this.loadNext('', this.currentId);
        },
        sendAnswer(answer) {
            // Save current question + answer to history
            this.history.push({
                question: this.current.text,
                answer: answer
            });
            this.loading = true;
            this.current = false;
            this.loadNext(answer, this.currentId);
        },
        loadNext(answer, questionId) {
            fetch('/safety-evaluate/api-next-question/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    question_id: questionId,
                    answer: answer
                })
            })
            .then(res => res.json())
            .then(data => {
                console.log(data);
                this.current = data;
                this.currentId = data.id || null;
                this.loading = false;  // ✅ Hide loading here
            })
            .catch(() => {
                this.current = {
                    type: 'end',
                    message: 'Something went wrong. Please try again.'
                };
                this.loading = false;  // ✅ Even on error
            });
        },
        submitAnswers() {
            if (this.submitted) return;

            const payload = {
                answers: this.history,
                result_id: this.current?.id,
                question_set_id: this.questionSetId  // Optional
            };

            this.loading = true;

            fetch('/safety-evaluate/api-next-question/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed");
                return res.json();
            })
            .then(() => {
                this.submitted = true;
            })
            .catch(() => {
                alert('Failed to submit. Try again.');
            })
            .finally(() => {
                this.loading = false;
            });
        },

    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
