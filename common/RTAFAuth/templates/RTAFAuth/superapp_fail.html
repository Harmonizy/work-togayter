<!DOCTYPE html>
{% load static %}
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การยืนยันไม่สำเร็จ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #160025 0%, #080012 100%);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      position: relative;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Glow */
    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(170,80,255,0.18) 0%, transparent 75%);
      filter: blur(70px);
      animation: pulse 6s ease-in-out infinite;
      z-index: 0;
    }

    .glow.one { top: 12%; left: 10%; }
    .glow.two { bottom: 10%; right: 12%; animation-delay: 3s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* Content */
    .container-fail {
      position: relative;
      z-index: 2;
      padding: 1rem;
      max-width: 420px;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 15px;
      color: #c77dff;
      filter: drop-shadow(0 0 20px rgba(180, 100, 255, 0.6));
    }

    .title {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 1rem;
      color: #d6c2ff;
      opacity: 0.9;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .hint {
      font-size: 0.9rem;
      color: #bfa6ff;
      opacity: 0.75;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .icon { font-size: 3.2rem; }
      .desc { font-size: 0.95rem; }
    }
  </style>
</head>

<body>

  <!-- Glow -->
  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- Content -->
  <div class="container-fail">
    <div class="icon">
      <i class="bi bi-shield-exclamation"></i>
    </div>

    <div class="title">กรุณากด X เพื่อปิดหน้านี้และกดเข้าใช้งานใหม่อีกครั้ง</div>

    <div class="desc">
      การยืนยันผ่าน Super App ไม่สำเร็จ<br>
      หากปัญหายังคงอยู่ กรุณาติดต่อ Line OA<br>
      @688bgghd
    </div>

  </div>

</body>
</html>
