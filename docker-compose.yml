version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: ${CONTAINER_NAME:-web} 
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app
    ports:
      - "${HOST_PORT:-8081}:8000"
    env_file:      
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
    networks:
      - mydocker_mynetwork

networks:
  mydocker_mynetwork:
    external: true